[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[dev]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/market-snapshot"
  to = "/.netlify/functions/market-snapshot"
  status = 200

[[redirects]]
  from = "/api/stock-detail"
  to = "/.netlify/functions/stock-detail"
  status = 200

[[redirects]]
  from = "/api/market-brief"
  to = "/.netlify/functions/market-brief"
  status = 200

[[redirects]]
  from = "/api/stock-analysis"
  to = "/.netlify/functions/stock-analysis"
  status = 200

[[redirects]]
  from = "/api/stock-search"
  to = "/.netlify/functions/stock-search"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

