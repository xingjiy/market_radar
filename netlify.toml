[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/market-snapshot"
  to = "/.netlify/functions/market-snapshot"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
